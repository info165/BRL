# Cloudflare Pages project config. Committing this means the build output
# directory and compatibility date come from the repo rather than being typed
# into the dashboard, so a fresh deploy can't get them wrong.
#
# The site is the roboxtreme artifact in this pnpm workspace; Vite writes its
# static output to dist/public. Build command (set in Pages → Settings):
#   pnpm install && pnpm --filter @workspace/roboxtreme run build

name = "brl"
pages_build_output_dir = "artifacts/roboxtreme/dist/public"
compatibility_date = "2026-08-20"
